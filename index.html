<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Deutsch A1 Coach</title>
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Deutsch%20A1%20Coach%22%2C%22short_name%22%3A%22Deutsch%20A1%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%230f172a%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Fxml%2C%253Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20512%20512%27%253E%253Crect%20width%3D%27512%27%20height%3D%27512%27%20rx%3D%27110%27%20fill%3D%27%25230f172a%27%2F%253E%253Crect%20x%3D%2796%27%20y%3D%27136%27%20width%3D%27320%27%20height%3D%2780%27%20rx%3D%2712%27%20fill%3D%27%2523111827%27%2F%253E%253Crect%20x%3D%2796%27%20y%3D%27216%27%20width%3D%27320%27%20height%3D%2780%27%20fill%3D%27%2523dc2626%27%2F%253E%253Crect%20x%3D%2796%27%20y%3D%27296%27%20width%3D%27320%27%20height%3D%2780%27%20rx%3D%2712%27%20fill%3D%27%2523facc15%27%2F%253E%253Ctext%20x%3D%27256%27%20y%3D%27282%27%20font-family%3D%27sans-serif%27%20font-size%3D%2796%27%20font-weight%3D%27bold%27%20fill%3D%27white%27%20text-anchor%3D%27middle%27%253EA1%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D" />
  <style>
    :root {
      --bg: #0b1120;
      --surface: #131c31;
      --surface-2: #1c2842;
      --border: #273554;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.25);
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding-bottom: 88px;
      overflow-x: hidden;
    }

    .ltr {
      direction: ltr;
      text-align: left;
      unicode-bidi: isolate;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(11, 17, 32, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .header-top {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .flag-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(180deg, #111827 33%, #dc2626 33% 66%, #facc15 66%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.15);
    }

    .brand h1 {
      font-size: 16px;
      font-weight: 700;
    }

    .stats-pills {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill {
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .sync-dot.ok { background: var(--success); }
    .sync-dot.busy { background: var(--accent); animation: pulse 1s infinite; }
    .sync-dot.err { background: var(--danger); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .progress-track {
      max-width: 720px;
      margin: 10px auto 0;
      height: 6px;
      background: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--success));
      transition: width 0.35s ease;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }

    .view {
      display: none;
      animation: fadeIn 0.2s ease;
    }
    .view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .unit-header {
      margin: 24px 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .unit-header:first-child { margin-top: 4px; }
    .unit-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
    }

    .node-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    .node-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
    }
    .node-card:active {
      transform: scale(0.985);
    }
    .node-card:hover {
      border-color: var(--primary);
    }

    .node-card.checkpoint {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.14), rgba(245, 158, 11, 0.12));
      border-color: rgba(245, 158, 11, 0.45);
    }

    .node-card.done {
      border-color: rgba(16, 185, 129, 0.45);
    }

    .node-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .node-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .node-card.checkpoint .node-icon {
      background: rgba(245, 158, 11, 0.2);
    }
    .node-card.done .node-icon {
      background: rgba(16, 185, 129, 0.18);
    }

    .node-info h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .node-info p {
      font-size: 12.5px;
      color: var(--muted);
    }

    .node-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      white-space: nowrap;
    }
    .node-card.done .node-badge {
      background: rgba(16, 185, 129, 0.18);
      color: var(--success);
    }
    .node-card.checkpoint .node-badge {
      background: rgba(245, 158, 11, 0.2);
      color: var(--accent);
    }

    .lesson-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: var(--bg);
      overflow-y: auto;
      display: none;
      padding-bottom: 40px;
    }
    .lesson-overlay.open {
      display: block;
    }

    .lesson-topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(11, 17, 32, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .btn-ghost {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .lesson-body {
      max-width: 680px;
      margin: 0 auto;
      padding: 18px 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
    }

    .card h4 {
      font-size: 14px;
      color: var(--accent);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .vocab-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .vocab-item:last-child { border-bottom: none; }

    .vocab-de {
      font-weight: 700;
      font-size: 15px;
      color: #fff;
    }
    .vocab-ar {
      font-size: 13px;
      color: var(--muted);
    }

    .vocab-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
    }
    .icon-btn:active { transform: scale(0.92); }

    .ai-box {
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
      font-size: 13.5px;
      white-space: pre-wrap;
    }

    .quiz-opt {
      width: 100%;
      text-align: right;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 12px;
      margin-top: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.15s;
    }
    .lesson-practice-prompt { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
    .lesson-textarea { width: 100%; min-height: 96px; resize: vertical; direction: ltr; text-align: left; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 12px; font: inherit; }
    .lesson-feedback { display: none; margin-top: 10px; padding: 12px; border-radius: 12px; background: rgba(59,130,246,.1); border: 1px solid rgba(59,130,246,.3); white-space: pre-wrap; font-size: 13px; line-height: 1.8; }
    .quiz-feedback { margin-top: 10px; min-height: 24px; font-size: 13px; font-weight: 700; }    .lesson-stage { display:none; animation:fadeIn .18s ease; }
    .lesson-stage.active { display:block; }
    .lesson-nav { display:flex; gap:10px; margin:12px 0 24px; }
    .lesson-nav .btn-primary { flex:1; }
    .lesson-nav .btn-ghost { min-width:100px; }
    .lesson-hero { background: linear-gradient(135deg, rgba(34,197,94,.18), rgba(59,130,246,.16)); border: 1px solid rgba(34,197,94,.35); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
    .lesson-hero-top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
    .lesson-steps { display:flex; gap:6px; margin-top:12px; }
    .lesson-step { flex:1; height:6px; border-radius:99px; background:var(--surface-2); }
    .lesson-step.active { background:var(--success); }
    .lesson-step-labels { display:flex; justify-content:space-between; gap:4px; color:var(--muted); font-size:10px; margin-top:5px; }
    .practice-question { border:1px solid var(--border); border-radius:14px; padding:12px; margin-top:10px; }
    .practice-choice { width:100%; text-align:right; background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:11px; padding:10px 12px; margin-top:7px; cursor:pointer; }
    .practice-choice.correct { border-color:var(--success); background:rgba(16,185,129,.18); }
    .practice-choice.wrong { border-color:var(--danger); background:rgba(239,68,68,.18); }
    .practice-choice-feedback { min-height:20px; margin-top:7px; font-size:12px; font-weight:700; }    .quiz-opt.correct {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--success);
      color: #fff;
    }
    .quiz-opt.wrong {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--danger);
    }

    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 14px var(--primary-glow);
    }
    .btn-primary.success { background: var(--success); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .chat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 210px);
      min-height: 400px;
      overflow: hidden;
    }

    .chat-context-banner {
      background: rgba(245, 158, 11, 0.12);
      border-bottom: 1px solid rgba(245, 158, 11, 0.3);
      padding: 10px 14px;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 86%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.55;
      position: relative;
    }
    .msg.ai {
      align-self: flex-start;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-bottom-right-radius: 4px;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--primary);
      color: #fff;
      border-bottom-left-radius: 4px;
    }

    .msg-de {
      direction: ltr;
      text-align: left;
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 4px;
    }
    .msg-ar {
      font-size: 12.5px;
      color: #cbd5e1;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 4px;
      margin-top: 4px;
    }
    .msg-speak {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,255,255,0.08);
      border: none;
      color: #fff;
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .chat-input-area {
      border-top: 1px solid var(--border);
      padding: 10px;
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }

    .mic-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .mic-btn.recording {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
      animation: pulse 1s infinite;
    }

    .send-btn {
      height: 42px;
      padding: 0 14px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 12.5px;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .form-control {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13.5px;
      outline: none;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .status-text {
      font-size: 12.5px;
      margin-top: 8px;
      min-height: 18px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: rgba(19, 28, 49, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
    }

    .nav-item {
      flex: 1;
      max-width: 160px;
      background: none;
      border: none;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px;
      border-radius: 10px;
    }
    .nav-item span.ico {
      font-size: 20px;
    }
    .nav-item.active {
      color: var(--primary);
      background: rgba(59, 130, 246, 0.1);
    }

    .chip-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }
    .chip {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: var(--primary);
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div class="brand">
        <div class="flag-badge">A1</div>
        <div>
          <h1>Deutsch A1 Coach</h1>
        </div>
      </div>
      <div class="stats-pills">
        <div class="pill" title="نقاط الخبرة">⚡ <span id="xpCount">0</span> XP</div>
        <div class="pill" title="حالة المزامنة السحابية">
          <span class="sync-dot" id="syncDot"></span>
          <span id="syncLabel">محلي</span>
        </div>
      </div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="globalProgress"></div>
    </div>
  </header>

  <main class="container">

    <section id="view-path" class="view active">
      <div id="pathContainer"></div>
    </section>

    <section id="view-chat" class="view">
      <div class="chip-row" id="scenarioChips">
        <button class="chip active" data-topic="محادثة عامة حرة بمستوى A1 باستخدام كل ما تعلمه الطالب">🗣️ محادثة عامة</button>
        <button class="chip" data-topic="في المقهى والمطعم: طلب قهوة وطعام والسؤال عن الحساب">☕ في المقهى</button>
        <button class="chip" data-topic="التعارف لأول مرة: الاسم، البلد، السكن، العمر، والعمل">👋 تعارف جديد</button>
        <button class="chip" data-topic="في التسوق وسوبر ماركت: السؤال عن الأسعار والملابس والمقاسات">🛒 التسوق والملابس</button>
        <button class="chip" data-topic="السؤال عن الاتجاهات والمواصلات في المدينة">🚆 المواصلات</button>
      </div>

      <div class="chat-box">
        <div class="chat-context-banner">
          <span>🎯 المدرب يركز على كلماتك وقواعدك المدروسة</span>
          <button class="btn-ghost" style="padding:4px 8px;font-size:11px" onclick="resetFreeChat()">محادثة جديدة</button>
        </div>
        <div class="chat-messages" id="freeChatMessages"></div>
        <div class="chat-input-area">
          <button class="mic-btn" id="freeMicBtn" onclick="toggleMic('free')" title="تحدث بالألمانية">🎙️</button>
          <input type="text" id="freeChatInput" class="chat-input ltr" placeholder="Schreib auf Deutsch..." onkeydown="if(event.key==='Enter') sendFreeChat()" />
          <button class="send-btn" onclick="sendFreeChat()">إرسال</button>
        </div>
      </div>
    </section>

    <section id="view-settings" class="view">
      <div class="card">
        <h4>🤖 إعدادات الذكاء الاصطناعي (AI)</h4>
        <div class="form-group">

    const DEFAULT_STATE = {

        aiMode: "auto",

    let state = loadState();
    let activeCheckpoint = null;
    let currentFreeTopic = "محادثة عامة حرة بمستوى A1 باستخدام كل ما تعلمه الطالب";
    let recognition = null;
    let activeMicTarget = null;

    function loadState() {
      try {
        const raw = localStorage.getItem("deutsch_a1_v2");
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const parsed = JSON.parse(raw);
        return {
          ...DEFAULT_STATE,
          ...parsed,
          settings: { ...DEFAULT_STATE.settings, ...(parsed.settings || {}) }
        };
      } catch {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    function saveState(autoCloud = true) {
      localStorage.setItem("deutsch_a1_v2", JSON.stringify(state));
      updateHeaderUI();
      if (autoCloud && state.settings.gistToken && state.settings.gistId) {
        debouncedCloudPush();
      }
    }

    function updateHeaderUI() {
      document.getElementById("xpCount").textContent = state.xp;
      const allNodes = CURRICULUM.flatMap(u => u.nodes);
      const pct = Math.round((state.completed.length / allNodes.length) * 100);
      document.getElementById("globalProgress").style.width = pct + "%";

      const dot = document.getElementById("syncDot");
      const lbl = document.getElementById("syncLabel");
      if (state.settings.gistToken && state.settings.gistId) {
        dot.className = "sync-dot ok";
        lbl.textContent = "متزامن";
      } else {
        dot.className = "sync-dot";
        lbl.textContent = "محلي";
      }

      const summary = document.getElementById("summaryStats");
      if (summary) {
        summary.textContent = `أنجزت ${state.completed.length} من ${allNodes.length} محطة (${pct}%) • إجمالي النقاط: ${state.xp} XP`;
      }
    }

    function renderPath() {
      const container = document.getElementById("pathContainer");
      container.innerHTML = "";

      CURRICULUM.forEach(unit => {
        const uHead = document.createElement("div");
        uHead.className = "unit-header";
        uHead.innerHTML = `<span class="unit-title">${unit.unit}</span>`;
        container.appendChild(uHead);

        const list = document.createElement("div");
        list.className = "node-list";

        unit.nodes.forEach(node => {
          const isDone = state.completed.includes(node.id);
          const card = document.createElement("div");
          card.className = `node-card ${node.type === "checkpoint" ? "checkpoint" : ""} ${isDone ? "done" : ""}`;
          card.onclick = () => node.type === "lesson" ? openLesson(node) : openCheckpoint(node);

          const badgeText = isDone
            ? "✓ مكتمل"
            : (node.type === "checkpoint" ? "محادثة AI" : `+${node.xp} XP`);

          card.innerHTML = `
            <div class="node-left">
              <div class="node-icon">${isDone ? "✅" : node.icon}</div>
              <div class="node-info">
                <h3>${node.title}</h3>
                <p>${node.desc}</p>
              </div>
            </div>
            <span class="node-badge">${badgeText}</span>
          `;
          list.appendChild(card);
        });

        container.appendChild(list);
      });
    }

    function switchTab(tab) {
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
      document.getElementById("view-" + tab).classList.add("active");
      document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add("active");

      if (tab === "chat" && state.freeChat.length === 0) {
        initFreeChat();
      }
    }

      activeCheckpoint = null;

      body.innerHTML = `

    function showLessonStep(step) {
      const stages = Array.from(document.querySelectorAll("#overlayBody .lesson-stage"));
      const nextStep = Math.max(0, Math.min(stages.length - 1, step));
      stages.forEach((stage, index) => stage.classList.toggle("active", index === nextStep));
      document.querySelectorAll(".lesson-step").forEach((bar, index) => bar.classList.toggle("active", index <= nextStep));
      const titles = ["افهم الدرس", "اسمع واتعلم الكلمات", "تدريب المفردات", "اكتب جملك", "التحدي الأخير"];
      document.getElementById("lessonStageTitle").textContent = `المرحلة ${nextStep + 1} من ${stages.length} • ${titles[nextStep]}`;
      document.getElementById("lessonPrevBtn").disabled = nextStep === 0;
      document.getElementById("lessonNextBtn").style.display = nextStep === stages.length - 1 ? "none" : "block";
      document.getElementById("lessonPrevBtn").style.visibility = nextStep === stages.length - 1 ? "hidden" : "visible";
      document.getElementById("overlayBody").dataset.stage = String(nextStep);
      document.getElementById("lessonOverlay").scrollTop = 0;
    }

    function moveLessonStep(direction) {
      const body = document.getElementById("overlayBody");
      const current = Number(body.dataset.stage || 0);
      if (direction > 0 && current === 2) {
        const questions = Array.from(document.querySelectorAll(".practice-question"));
        if (questions.some(q => q.dataset.solved !== "true")) { alert("جاوب صح على أسئلة المفردات الثلاثة الأول."); return; }
      }
      if (direction > 0 && current === 3 && !document.getElementById("lessonPracticeInput").value.trim()) { alert("اكتب جملة واحدة على الأقل قبل ما تكمل."); return; }
      showLessonStep(current + direction);
    }
    function checkPracticeChoice(btn) {

      buttons.forEach(b => b.classList.remove("correct", "wrong"));
      const correct = Array.from(buttons).find(b => b.dataset.correct === "true");
      const feedback = card.querySelector(".practice-choice-feedback");
      if (btn.dataset.correct === "true") {
        btn.classList.add("correct");

        feedback.innerHTML = `<span style="color:var(--success)">✅ Genau! إجابة صحيحة.</span>`;

        btn.classList.add("wrong");

        feedback.innerHTML = `<span style="color:var(--danger)">قريب! الصحيح: ${correct ? correct.textContent : ""}</span>`;
      }
    }

      const history = state.cpChats[activeCheckpoint.id];

التنسيق الإلزامي لردك:
اكتب ردك باللغة الألمانية أولاً في سطر واحد، ثم اكتب تحته علامة ||| ثم اكتب الترجمة العربية + أي تصحيح لغوي بسيط إن وجد.`;

        role: m.role === "user" ? "user" : "assistant",
        content: m.role === "user" ? m.text : m.de
      }));

      const rawReply = await callAI(apiMsgs, sys);

    function renderMessages(containerId, list) {
      const box = document.getElementById(containerId);
      if (!box) return;
      box.innerHTML = "";
      list.forEach(m => {
        const div = document.createElement("div");
        div.className = `msg ${m.role}`;
        if (m.role === "user") {
          div.innerHTML = `<div class="ltr">${escapeHtml(m.text)}</div>`;
        } else {
          const safeDe = m.de.replace(/'/g, "\\'").replace(/"/g, "&quot;");
          div.innerHTML = `
            <div class="msg-de">${escapeHtml(m.de)}</div>
            ${m.ar ? `<div class="msg-ar">${escapeHtml(m.ar)}</div>` : ""}
            ${m.de !== "..." ? `<button class="msg-speak" onclick="speakGerman('${safeDe}')">🔊 استمع</button>` : ""}
          `;
        }
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    function speakGerman(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "de-DE";
      utter.rate = 0.92;
      const voices = window.speechSynthesis.getVoices();
      const deVoice = voices.find(v => v.lang.startsWith("de"));
      if (deVoice) utter.voice = deVoice;
      window.speechSynthesis.speak(utter);
    }

    function toggleMic(target) {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        alert("المتصفح لا يدعم التعرف على الصوت. استخدم Google Chrome.");
        return;
      }
      if (recognition && activeMicTarget === target) {
        recognition.stop();
        return;
      }
      if (recognition) recognition.stop();
      recognition = new SpeechRec();
      recognition.lang = "de-DE";
      recognition.interimResults = false;
      activeMicTarget = target;

      const btnId = target === "cp" ? "cpMicBtn" : "freeMicBtn";
      const inputId = target === "cp" ? "cpInput" : "freeChatInput";
      document.getElementById(btnId).classList.add("recording");

      recognition.onresult = e => {
        document.getElementById(inputId).value = e.results[0][0].transcript;
      };
      recognition.onerror = recognition.onend = () => {
        document.getElementById(btnId).classList.remove("recording");
        activeMicTarget = null;
      };
      recognition.start();
    }

    async function callAI(messages, systemInstruction) {
      const { aiMode, geminiKey, geminiModel, ollamaUrl, ollamaModel } = state.settings;
      const isLocalhost = ["localhost", "127.0.0.1", ""].includes(window.location.hostname);

      if (aiMode === "ollama" || (aiMode === "auto" && isLocalhost)) {
        try {
          return await fetchOllama(ollamaUrl, ollamaModel, messages, systemInstruction);
        } catch (e) {
          if (aiMode === "ollama") return "⚠️ تعذر الاتصال بـ Ollama المحلي.";
        }
      }

      if (!geminiKey) return "⚠️ أضف مفتاح Gemini API في تبويب الإعدادات.";

      const modelsToTry = [geminiModel, "gemini-2.5-flash", "gemini-2.5-flash-lite"].filter((v, i, a) => v && a.indexOf(v) === i);
      let lastErr = "";
      for (const model of modelsToTry) {
        try {
          return await fetchGemini(geminiKey, model, messages, systemInstruction);
        } catch (err) { lastErr = err.message; }
      }
      return `⚠️ تعذر الاتصال بالسيرفر حالياً (${lastErr}).`;
    }

    async function fetchOllama(url, model, messages, systemInstruction) {
      const res = await fetch(`${url.replace(/\/$/, "")}/api/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model, stream: false, messages: [{ role: "system", content: systemInstruction }, ...messages] })
      });
      if (!res.ok) throw new Error("Ollama HTTP " + res.status);
      const data = await res.json();
      return data.message.content;
    }

    async function fetchGemini(key, model, messages, systemInstruction) {
      const contents = messages.map(m => ({ role: m.role === "user" ? "user" : "model", parts: [{ text: m.content }] }));
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ systemInstruction: { parts: [{ text: systemInstruction }] }, contents })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
      return data.candidates[0].content.parts[0].text;
    }

    let syncTimer = null;
    function debouncedCloudPush() {
      clearTimeout(syncTimer);

    async function createNewGist() {
      saveSettings();
      const st = document.getElementById("syncStatus");
      if (!state.settings.gistToken) {
        st.innerHTML = `<span style="color:var(--danger)">⚠️ أدخل GitHub Token أولاً.</span>`;
        return;
      }
      st.textContent = "⏳ جاري إنشاء سحابة Gist...";
      try {
        const res = await fetch("https://api.github.com/gists", {
          method: "POST",
          headers: { "Authorization": `token ${state.settings.gistToken}`, "Content-Type": "application/json" },
          body: JSON.stringify({ description: "Deutsch A1 Coach Sync", public: false, files: { "german_a1_sync.json": { content: JSON.stringify(getSyncPayload()) } } })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Error");
        state.settings.gistId = data.id;
        document.getElementById("gistId").value = data.id;
        saveState(false);
        st.innerHTML = `<span style="color:var(--success)">✅ تم إنشاء Gist وربطه بنجاح!</span>`;
      } catch (e) {
        st.innerHTML = `<span style="color:var(--danger)">❌ فشل الإنشاء: ${e.message}</span>`;
      }
    }

    function getSyncPayload() {
      return { completed: state.completed, xp: state.xp, cpChats: state.cpChats, updatedAt: Date.now() };
    }

    async function pushToGist() {
      const { gistToken, gistId } = state.settings;
      if (!gistToken || !gistId) return;
      document.getElementById("syncDot").className = "sync-dot busy";
      try {
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
          method: "PATCH",
          headers: { "Authorization": `token ${gistToken}`, "Content-Type": "application/json" },
          body: JSON.stringify({ files: { "german_a1_sync.json": { content: JSON.stringify(getSyncPayload()) } } })
        });
        if (!res.ok) throw new Error("Sync failed");
        document.getElementById("syncDot").className = "sync-dot ok";
        document.getElementById("syncLabel").textContent = "متزامن";
      } catch {
        document.getElementById("syncDot").className = "sync-dot err";
        document.getElementById("syncLabel").textContent = "خطأ مزامنة";
      }
    }

    async function pullFromGist(manual = false) {
      const { gistToken, gistId } = state.settings;
      if (!gistToken || !gistId) return;
      const st = document.getElementById("syncStatus");
      document.getElementById("syncDot").className = "sync-dot busy";
      try {
        const res = await fetch(`https://api.github.com/gists/${gistId}`, { headers: { "Authorization": `token ${gistToken}` }, cache: "no-store" });
        const data = await res.json();
        const rawFile = data.files?.["german_a1_sync.json"]?.content;
        if (rawFile) {
          const remote = JSON.parse(rawFile);
          if (remote && Array.isArray(remote.completed)) {
            state.completed = Array.from(new Set([...state.completed, ...remote.completed]));
            state.xp = Math.max(state.xp, remote.xp || 0);
            state.cpChats = { ...remote.cpChats, ...state.cpChats };
            saveState(false);
            renderPath();
          }
        }
        await pushToGist();
        if (manual && st) st.innerHTML = `<span style="color:var(--success)">✅ تمت المزامنة بين الأجهزة بنجاح!</span>`;
      } catch (e) {
        document.getElementById("syncDot").className = "sync-dot err";
        if (manual && st) st.innerHTML = `<span style="color:var(--danger)">❌ تعذرت المزامنة: ${e.message}</span>`;
      }
    }

    function syncNow(manual) {
      saveSettings();
      pullFromGist(manual);
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") pullFromGist(false);
    });

    populateSettingsUI();
    renderPath();
    updateHeaderUI();
    if (state.settings.gistToken && state.settings.gistId) pullFromGist(false);
  </script>
</body>
</html>
