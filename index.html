<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تعلم الألماني (A1 Pro v9 + Cloud Sync)</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d2330;--mut:#6b7280;--line:#dcd8cd;--pri:#1f4e79;--der:#1d5fd1;--die:#d12d4a;--das:#1e8a4c;--ok:#1e8a4c;--bad:#d12d4a;--warn:#d97706;--hi:#fef3c7;--call:#0f766e}
[data-theme=dark]{--bg:#14171f;--card:#1e222d;--tx:#e8eaf0;--mut:#9aa1b2;--line:#323848;--pri:#6aa6e0;--der:#6ea0ff;--die:#ff7089;--das:#4cc98a;--ok:#4cc98a;--bad:#ff7089;--warn:#fbbf24;--hi:#3b321c;--call:#14b8a6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 "Segoe UI",Tahoma,sans-serif}
.wrap{max-width:780px;margin:auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:21px;margin:6px 0}
.goal{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
nav{display:flex;gap:6px;overflow-x:auto;margin:10px 0;padding-bottom:4px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;transition:.15s}
button:hover:not(:disabled){border-color:var(--pri)}
button:disabled{opacity:.5;cursor:not-allowed}
button.pri,nav button.on{background:var(--pri);color:var(--bg);border-color:var(--pri)}
button.call-btn{background:var(--call);color:#fff;border-color:var(--call);font-weight:700}
button.mic-on{background:var(--bad);color:#fff;border-color:var(--bad);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
nav button{white-space:nowrap}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin:4px 0 10px}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:10px 0;text-align:center}
.de{font-size:34px;font-weight:700;direction:ltr}
.der{color:var(--der)}.die{color:var(--die)}.das{color:var(--das)}
.ex{direction:ltr;color:var(--mut);font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.opts button{flex:1 1 44%;font-size:19px}
.opts button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opts button.bad{background:var(--bad);color:var(--bad);border-color:var(--bad)}
.opts button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stats b{display:block;font-size:26px}
.msg{min-height:1.6em;margin-top:10px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.li span{direction:ltr}
.g p{margin:6px 0}.g code{direction:ltr;display:inline-block;background:var(--bg);padding:1px 6px;border-radius:4px}
.node{width:68px;height:68px;border-radius:50%;font-size:21px;margin:8px;padding:0;background:var(--line);color:var(--mut)}
.node.open{background:var(--pri);color:var(--bg);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.node.done{background:#e0a81c;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--das);transition:width .3s}
.top{display:flex;gap:10px;align-items:center}
.umlaut{display:flex;gap:6px;justify-content:center;margin:6px 0;direction:ltr}
.umlaut button{padding:4px 12px;font-weight:bold}
.badge{font-size:12px;padding:2px 8px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:inline-block}
.chip{display:inline-block;padding:3px 9px;margin:3px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:14px;direction:ltr;cursor:pointer}
.chip:hover{border-color:var(--pri)}
.chat-box{height:310px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);text-align:right;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:88%;padding:10px 14px;border-radius:12px;line-height:1.55}
.bubble.ai{background:var(--card);border:1px solid var(--line);align-self:flex-start}
.bubble.me{background:var(--pri);color:var(--bg);align-self:flex-end}
.bubble .de-line{direction:ltr;text-align:left;font-weight:700;font-size:17px}
.bubble .ar-line{direction:rtl;text-align:right;color:var(--mut);font-size:14px;margin-top:4px}
.bubble .fix-line{direction:rtl;text-align:right;background:var(--hi);padding:5px 9px;border-radius:8px;font-size:14px;margin-top:6px;border-right:3px solid var(--warn)}
.call-panel{border:2px solid var(--call);border-radius:14px;padding:16px;margin-bottom:12px;background:var(--card);text-align:center}
.call-orb{width:76px;height:76px;border-radius:50%;margin:8px auto;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--bg);border:2px solid var(--call);transition:.2s}
.call-orb.speaking{background:var(--call);color:#fff;animation:pulse 1s infinite}
.call-orb.listening{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1s infinite}
.call-orb.thinking{background:var(--warn);border-color:var(--warn);color:#fff}
.interim-box{min-height:28px;direction:ltr;font-size:16px;color:var(--pri);font-style:italic;margin:6px 0}
.story-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--line);direction:ltr;text-align:left;font-size:18px}
.story-line:last-child{border-bottom:none}
.story-hi{background:var(--hi);padding:1px 5px;border-radius:5px;font-weight:700;cursor:pointer}
</style>
</head>

// ===== 3. STORAGE, STATE & CLOUD SYNC =====
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MEM={};
let storageOk=true;
try{localStorage.setItem("__t","1");localStorage.removeItem("__t");}catch(e){storageOk=false;}
function load(k,d){
  if(Object.prototype.hasOwnProperty.call(MEM,k))return MEM[k];
  try{
    const v=localStorage.getItem(k);
    if(v!==null){
      const p=JSON.parse(v);
      if(p!==null && p!==undefined){
        if(Array.isArray(d) && !Array.isArray(p))return d;
        if(d && typeof d==="object" && !Array.isArray(d) && (typeof p!=="object" || Array.isArray(p)))return d;
        MEM[k]=p;
        return p;
      }
    }
  }catch(e){}
  return d;
}
function save(k,v,skipTouch=false){
  MEM[k]=v;
  try{localStorage.setItem(k,JSON.stringify(v))}catch(e){storageOk=false;}
  if(!skipTouch && ["de_words","de_stats","de_path","de_stories","de_miss"].includes(k)){
    markDirty();
  }
}

let words=load("de_words",[]);
if(load("de_v",0)<9 || !words.length){
  const old={};words.forEach(x=>{if(x&&x.w)old[x.w]=x});
  words=ALL.map(s=>old[s.w]?{...s,...old[s.w],u:s.u,en:s.en,pl:s.pl||old[s.w].pl||""}:{...s});
  const known=new Set(ALL.map(s=>s.w));
  Object.values(old).forEach(x=>{if(!known.has(x.w))words.push({...x,u:x.u||"كلماتي"})});
  save("de_v",9,true);save("de_words",words,true);
}

let st=load("de_stats",{streak:0,last:"",right:0,total:0,todayDate:"",todayXp:0,goal:50,updatedAt:0});

if(!pr.done || typeof pr.done!=="object")pr.done={};
if(typeof pr.xp!=="number")pr.xp=0;
let stories=load("de_stories",[]);
let MISS=load("de_miss",{});
const DAY=864e5, GAP=[0,1,3,7,14,30];

// Cloud Sync Engine (GitHub Gist or Firebase Realtime DB)
let syncTimer=null, syncState="idle";
function syncCfg(){
  return {
    type: load("de_sync_type","none"), // none | gist | firebase
    token: String(load("de_sync_token","")).trim(),
    id: String(load("de_sync_id","")).trim()
  };
}
function setSyncBadge(state,title=""){
  syncState=state;
  const b=$("#sync-btn");if(!b)return;
  const map={idle:"☁️",syncing:"⏳",ok:"☁️✅",err:"☁️⚠️",off:"☁️"};
  b.textContent=map[state]||"☁️";
  if(title)b.title=title;
}
function markDirty(){
  st.updatedAt=Date.now();
  MEM["de_stats"]=st;
  try{localStorage.setItem("de_stats",JSON.stringify(st))}catch(e){}
  const cfg=syncCfg();
  if(cfg.type==="none")return;
  if(syncTimer)clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>syncPush(true),2500);
}
function buildSnapshot(){
  return {v:9,updatedAt:st.updatedAt||Date.now(),words,pr,st,stories,MISS};
}
function applySnapshot(snap){
  if(!snap || !Array.isArray(snap.words))return false;
  const byW={};snap.words.forEach(x=>{if(x&&x.w)byW[x.w]=x});
  words=ALL.map(s=>byW[s.w]?{...s,...byW[s.w],u:s.u,en:s.en,pl:s.pl||byW[s.w].pl||""}:{...s});
  const known=new Set(ALL.map(s=>s.w));
  snap.words.forEach(x=>{if(x&&x.w&&!known.has(x.w))words.push({...x,u:x.u||"كلماتي"})});
  if(snap.pr){pr=snap.pr;if(!pr.done)pr.done={};}
  if(snap.st){st={...st,...snap.st};}
  if(Array.isArray(snap.stories))stories=snap.stories;
  if(snap.MISS && typeof snap.MISS==="object")MISS=snap.MISS;
  save("de_words",words,true);
  save("de_path",pr,true);
  save("de_stats",st,true);
  save("de_stories",stories,true);
  save("de_miss",MISS,true);
  renderGoal();
  return true;
}
async function cloudRead(){
  const c=syncCfg();
  if(c.type==="gist"){
    if(!c.token||!c.id)throw new Error("أدخل GitHub Token و Gist ID أولاً.");
    const r=await fetch("https://api.github.com/gists/"+encodeURIComponent(c.id),{
      headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json"}
    });
    if(!r.ok)throw new Error("GitHub Gist HTTP "+r.status);
    const j=await r.json();
    const file=j.files&&j.files["german_a1_sync.json"];
    if(!file||!file.content)return null;
    return JSON.parse(file.content);
  }
  if(c.type==="firebase"){
    if(!c.id)throw new Error("أدخل رابط Firebase Realtime DB أولاً.");
    const url=c.id.replace(/\/+$/,"")+(c.id.endsWith(".json")?"":"/german_a1_sync.json");
    const r=await fetch(url);
    if(!r.ok)throw new Error("Firebase HTTP "+r.status);
    return await r.json();
  }
  return null;
}
async function cloudWrite(snap){
  const c=syncCfg();
  if(c.type==="gist"){
    if(!c.token||!c.id)throw new Error("أدخل GitHub Token و Gist ID أولاً.");
    const r=await fetch("https://api.github.com/gists/"+encodeURIComponent(c.id),{
      method:"PATCH",
      headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json","Content-Type":"application/json"},
      body:JSON.stringify({files:{"german_a1_sync.json":{content:JSON.stringify(snap)}}})
    });
    if(!r.ok)throw new Error("GitHub Gist HTTP "+r.status);
    return true;
  }
  if(c.type==="firebase"){
    if(!c.id)throw new Error("أدخل رابط Firebase Realtime DB أولاً.");
    const url=c.id.replace(/\/+$/,"")+(c.id.endsWith(".json")?"":"/german_a1_sync.json");
    const r=await fetch(url,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(snap)});
    if(!r.ok)throw new Error("Firebase HTTP "+r.status);
    return true;
  }
  return false;
}
async function syncNow(silent=false){
  const c=syncCfg();
  if(c.type==="none"){
    if(!silent){show("stats");setTimeout(()=>{const d=$("#sync-details");if(d)d.open=true;},50);}
    return "off";
  }
  setSyncBadge("syncing","جاري المزامنة...");
  try{
    const remote=await cloudRead();
    const localTs=st.updatedAt||0;
    const remoteTs=(remote&&remote.updatedAt)||0;
    if(remote && remoteTs>localTs){
      applySnapshot(remote);
      if(R[activeTab])R[activeTab]();
      setSyncBadge("ok","تم جلب أحدث تقدم من السحابة");
      return "pulled";
    }else{
      if(!st.updatedAt)st.updatedAt=Date.now();
      await cloudWrite(buildSnapshot());
      setSyncBadge("ok","تم رفع تقدمك للسحابة");
      return "pushed";
    }
  }catch(e){
    setSyncBadge("err","خطأ في المزامنة: "+e.message);
    if(!silent)throw e;
    return "err";
  }
}
async function syncPush(silent=true){
  const c=syncCfg();if(c.type==="none")return;
  setSyncBadge("syncing","جاري الحفظ في السحابة...");
  try{
    await cloudWrite(buildSnapshot());
    setSyncBadge("ok","متزامن مع السحابة");
  }catch(e){
    setSyncBadge("err","فشل الرفع: "+e.message);
  }
}
$("#sync-btn").onclick=()=>syncNow(false).catch(e=>alert("خطأ في المزامنة: "+e.message));

function checkDay(){
  const t=day();
  if(st.todayDate!==t){st.todayDate=t;st.todayXp=0;save("de_stats",st,true);}
}
checkDay();

function touch(ok,xpGain=5){
  checkDay();
  st.total++;
  if(ok){st.right++;st.todayXp=(st.todayXp||0)+xpGain;}
  const t=day();
  if(st.last!==t){
    const y=new Date(Date.now()-DAY).toISOString().slice(0,10);
    st.streak=st.last===y?st.streak+1:1;
    st.last=t;
  }
  save("de_stats",st);
  renderGoal();
}

function promoteWord(w,level=1){
  w.box=Math.min(5,Math.max(w.box||0,level));
  w.due=Date.now()+GAP[w.box]*DAY;
}

const saveWords=()=>save("de_words",words);
const cls=w=>w.art||"";
const label=w=>(w.art?w.art+" ":"")+w.w;

function renderGoal(){
  checkDay();
  const pct=Math.min(100,Math.round((st.todayXp||0)/(st.goal||50)*100));
  $("#goal-bar").innerHTML=`<span>🔥 ${st.streak} يوم</span> | <span>الهدف اليومي: ${st.todayXp||0}/${st.goal||50} XP (${pct}%)</span>`;
}

    oUrl: String(load("de_ollama_url","http://localhost:11434")).trim().replace(/\/+$/,""),
    oModel: String(load("de_ollama_model","gpt-oss:20b")).trim()
  };
}
function getCleanKey(){
  const c=aiCfg();
  if(c.mode==="local")return "ollama";
  if(c.mode==="cloud")return c.gKey;
  return c.gKey || "ollama";
}
function aiBadgeText(){
  const c=aiCfg();
  if(c.mode==="cloud")return c.gKey?"☁️ سحابي (Gemini)":"⚠️ أضف مفتاح Gemini";
  if(c.mode==="local")return "💻 محلي (Ollama)";
  return c.gKey?"🔄 تلقائي (Ollama + Gemini)":"💻 محلي (Ollama)";
}

function extractJsonObj(raw){
  const cleaned=String(raw||"").replace(/```json/gi,"").replace(/```/g,"").trim();
  const m=cleaned.match(/\{[\s\S]*\}/);
  return JSON.parse(m?m[0]:cleaned);
}

async function callOllama(prompt, timeoutMs=0){
  const c=aiCfg();
  const ctrl = timeoutMs ? new AbortController() : null;
  const tid = timeoutMs ? setTimeout(()=>ctrl.abort(), timeoutMs) : null;
  let res;
  try{
    res=await fetch(c.oUrl+"/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      signal: ctrl?ctrl.signal:undefined,
      body:JSON.stringify({model:c.oModel,stream:false,messages:[{role:"user",content:prompt}]})
    });
  }catch(e){
    throw new Error("تعذر الاتصال بـ Ollama المحلي.");
  }finally{
    if(tid)clearTimeout(tid);
  }
  let d=null;try{d=await res.json()}catch(e){}
  if(!res.ok)throw new Error((d&&d.error)||("Ollama HTTP "+res.status));
  const t=d&&d.message&&d.message.content;
  if(!t)throw new Error("Ollama رجّع رد فاضي");
  return t;
}

async function callCloudGemini(prompt){
  const c=aiCfg();
  if(!c.gKey)throw new Error("أدخل مفتاح Gemini API السحابي في إعدادات AI بالأسفل.");
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(c.gModel)}:generateContent?key=${encodeURIComponent(c.gKey)}`;
  let res;
  try{
    res=await fetch(url,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})
    });
  }catch(e){
    throw new Error("تعذر الاتصال بـ Gemini API. تأكد من الإنترنت.");
  }
  let d=null;try{d=await res.json()}catch(e){}
  if(!res.ok)throw new Error((d&&d.error&&d.error.message)||("Gemini HTTP "+res.status));
  const t=d&&d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts&&d.candidates[0].content.parts[0]&&d.candidates[0].content.parts[0].text;
  if(!t)throw new Error("Gemini رجّع رد فاضي");
  return t;
}

async function callGemini(prompt){
  const c=aiCfg();
  if(c.mode==="local") return await callOllama(prompt, 0);
  if(c.mode==="cloud") return await callCloudGemini(prompt);
  // Auto mode: if on mobile or non-localhost with a Gemini key, try Ollama quickly (2s) then fall back to Gemini
  const isLocalHost = ["localhost","127.0.0.1",""].includes(location.hostname);
  if(!isLocalHost && c.gKey){
    return await callCloudGemini(prompt);
  }
  if(c.gKey){
    try{
      return await callOllama(prompt, 2500);
    }catch(e){
      return await callCloudGemini(prompt);
    }
  }
  return await callOllama(prompt, 0);
}

// ===== 4. SPEECH SYNTHESIS (TTS) & SPEECH RECOGNITION (STT) =====
let deVoice=null;
let speakTimer=null;
window._activeUtterance=null;

function loadVoices(){
  if(!("speechSynthesis" in window))return;
  const vs=speechSynthesis.getVoices();
  deVoice=vs.find(v=>v.lang==="de-DE"&&v.localService)||vs.find(v=>v.lang.startsWith("de"))||null;
}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}

function stopSpeak(){
  if(speakTimer){clearTimeout(speakTimer);speakTimer=null;}
  try{speechSynthesis.cancel();}catch(e){}
  window._activeUtterance=null;
}

function speak(t,rate=.88,onDone=null){
  stopSpeak();
  const clean=String(t||"").trim();
  if(!clean || !("speechSynthesis" in window)){
    if(onDone)setTimeout(onDone,100);
    return;
  }
  try{
    const u=new SpeechSynthesisUtterance(clean);
    window._activeUtterance=u;
    u.lang="de-DE";
    if(deVoice)u.voice=deVoice;
    u.rate=rate;
    let finished=false;
    const finish=()=>{
      if(finished)return;
      finished=true;
      if(speakTimer){clearTimeout(speakTimer);speakTimer=null;}
      window._activeUtterance=null;
      if(onDone)onDone();
    };
    u.onend=finish;
    u.onerror=finish;
    const estMs=Math.max(2500, Math.round((clean.length * 95) / rate) + 1200);
    speakTimer=setTimeout(finish, estMs);
    speechSynthesis.speak(u);
  }catch(e){
    if(onDone)setTimeout(onDone,100);
  }
}

document.addEventListener("click",e=>{
  const sp=e.target.closest("[data-speak]");
  if(sp)speak(sp.dataset.speak,Number(sp.dataset.rate)||.88);
});

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let activeRec = null;
function stopMic(){
  if(activeRec){try{activeRec.abort()}catch(e){} activeRec=null;}
}

function normDe(s){
  return String(s).toLowerCase()
    .replace(/[.,!?;:"'()\-–—]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

function listenGerman({btn, interimResults=false, onInterim, onResult, onError, onEnd}){
  if(!SpeechRec){
    alert("متصفحك لا يدعم التعرف على الصوت (جرّب Google Chrome أو Microsoft Edge).");
    return;
  }
  if(activeRec){stopMic();return;}
  try{
    const rec = new SpeechRec();
    activeRec = rec;
    rec.lang = "de-DE";
    rec.interimResults = interimResults;
    rec.maxAlternatives = 4;
    if(btn){btn.classList.add("mic-on");btn.dataset.orig=btn.textContent;btn.textContent="🎙️ جاري الاستماع...";}
    let gotFinal = false;
    rec.onresult = e => {
      let interim = "";
      for(let i = e.resultIndex; i < e.results.length; i++){
        const res = e.results[i];
        if(res.isFinal){
          gotFinal = true;
          const alts = Array.from(res).map(r=>r.transcript).filter(t=>t&&t.trim());
          onResult(alts[0]||"", alts);
        }else{
          interim += res[0].transcript;
        }
      }
      if(interim && onInterim) onInterim(interim);
    };
    rec.onerror = e => {
      if(onError)onError(e.error);
    };
    rec.onend = () => {
      activeRec = null;
      if(btn){btn.classList.remove("mic-on");if(btn.dataset.orig)btn.textContent=btn.dataset.orig;}
      if(onEnd)onEnd(gotFinal);
    };
    rec.start();
  }catch(err){
    activeRec = null;
    if(onError)onError(err.message);
  }
}

let qz=null,qScore=0,qN=0,qMode="mix";
function pick(a,n){return a.slice().sort(()=>Math.random()-.5).slice(0,n)}
function umlautBar(targetId){
  return `<div class="umlaut">${["ä","ö","ü","ß","Ä","Ö","Ü"].map(c=>`<button type="button" onclick="insChar('${targetId}','${c}')">${c}</button>`).join("")}</div>`;
}
window.insChar=(id,ch)=>{const el=document.getElementById(id);if(!el)return;const s=el.selectionStart,e=el.selectionEnd;el.value=el.value.slice(0,s)+ch+el.value.slice(e);el.focus();el.setSelectionRange(s+1,s+1);};

R.quiz=function(){
  if(words.length<4){$("#p-quiz").innerHTML="<div class=card>أضف 4 كلمات على الأقل.</div>";return}
  const modes=[
    ["mix","شامل متنوع"],
    ["speak","نطق وتحدث 🎤"],
    ["type","كتابة وإملاء ✍️"],
    ["listen","استماع 🎧"],
    ["art","أدوات التعريف"]
  ];
  const mBar=`<div class="row" style="margin-bottom:8px">${modes.map(m=>`<button class="${qMode===m[0]?"pri":""}" onclick="qMode='${m[0]}';R.quiz()" style="padding:5px 10px;font-size:14px">${m[1]}</button>`).join("")}</div>`;
  
  let mode=qMode;
  if(mode==="mix"){
    const pool=SpeechRec?["mcq","type","listen","art","speak"]:["mcq","type","listen","art"];
    mode=pool[Math.floor(Math.random()*pool.length)];
  }
  const nouns=words.filter(w=>w.art);
  if(mode==="art"&&!nouns.length)mode="mcq";

  let w,opts,ans,text,uiType="mcq";
  if(mode==="art"){
    w=pick(nouns,1)[0];opts=["der","die","das"];ans=w.art;
    text=`ما هي أداة التعريف لكلمة <b dir=ltr>${esc(w.w)}</b> (${esc(w.ar)})؟`;
  }else if(mode==="listen"){
    w=pick(words,1)[0];ans=w.ar;
    opts=pick(words.filter(x=>x!==w&&x.ar!==w.ar),3).map(x=>x.ar).concat(w.ar).sort(()=>Math.random()-.5);
    text=`استمع جيداً واختر المعنى الصحيح: <button class="pri" id="qs-big">🔊 استمع للكلمة</button>`;
    setTimeout(()=>speak(label(w),.82),150);
  }else if(mode==="type"){
    w=pick(words,1)[0];ans=label(w);uiType="type";
    text=`اكتب بالألمانية ${w.art?"(مع الأداة der/die/das)":""}: <b>${esc(w.ar)}</b> <span style="color:var(--mut)">(${esc(w.en)})</span>`;
  }else if(mode==="speak"){

  }else{
    w=pick(words,1)[0];ans=w.ar;
    opts=pick(words.filter(x=>x!==w&&x.ar!==w.ar),3).map(x=>x.ar).concat(w.ar).sort(()=>Math.random()-.5);
    text=`ما معنى <b dir=ltr class="${cls(w)}">${esc(label(w))}</b>؟`;
  }

  qz={w,ans,done:0};
  let bodyHtml="";
  if(uiType==="type"){
    bodyHtml=`<input id="q-inp" dir="ltr" placeholder="اكتب الإجابة هنا..." autocomplete="off">
      ${umlautBar("q-inp")}

  }else if(uiType==="speak"){
    bodyHtml=`<div class="row">
        <button id="qs-hear">🔊 اسمع النطق أولاً</button>

      </div>
      <div id="q-heard" style="margin-top:8px;color:var(--mut);font-size:15px"></div>`;

  }

    <p>${text} ${(mode!=="listen"&&mode!=="speak")?'<button id="qs">🔊</button>':""}</p>

      finishQ(ok);

    $("#q-sub").onclick=check;

  }else if(uiType==="speak"){
    $("#q-skip").onclick=R.quiz;

          }
        },
        onError:err=>{heard.innerHTML=`<span style="color:var(--warn)">تعذر التقاط الصوت (${esc(err)}). تأكد من سماح المتصفح بالميكروفون.</span>`;}
      });
    };
  }else{
    $("#p-quiz .opts").onclick=e=>{
      const o=e.target.dataset.o;if(o===undefined||qz.done)return;
      const ok=o===qz.ans;
      e.target.classList.add(ok?"ok":"bad");
      document.querySelectorAll("#p-quiz .opts button").forEach(b=>{if(b.dataset.o===qz.ans)b.classList.add("ok")});

    };
  }
};

function getTargetWordsForStory(){
  if(storySource==="weak"){
    const weak=words.filter(w=>(w.box||0)<=1);
    return pick(weak.length?weak:words, 10);
  }
  if(storySource==="unit"){
    const uWords=words.filter(w=>(w.u||"كلماتي")===storyUnit);
    return pick(uWords.length?uWords:words, 10);
  }
  const learned=words.filter(w=>(w.box||0)>=1);
  return learned.length>=5 ? pick(learned, Math.min(12, learned.length)) : words.slice(0, 12);
}

function updateCallUI(){
  const panel = document.getElementById("voice-call-box");
  if(!panel) return;
  if(!voiceCall.active){
    panel.style.display = "none";
    return;
  }
  panel.style.display = "block";
  const orb = document.getElementById("vc-orb");
  const stTxt = document.getElementById("vc-state");
  const intTxt = document.getElementById("vc-interim");
  const noteTxt = document.getElementById("vc-note");
  const resumeBtn = document.getElementById("vc-resume");
  const skipBtn = document.getElementById("vc-skip-spk");

  orb.className = "call-orb " + voiceCall.state;
  if(voiceCall.state === "speaking"){
    orb.textContent = "🔊";
    stTxt.textContent = "المعلم يتحدث الآن بالألمانية...";
    if(skipBtn) skipBtn.style.display = "inline-block";
    if(resumeBtn) resumeBtn.style.display = "none";
  }else if(voiceCall.state === "listening"){
    orb.textContent = "🎙️";
    stTxt.textContent = "تحدث الآن بالألمانية... (أستمع إليك)";
    if(skipBtn) skipBtn.style.display = "none";
    if(resumeBtn) resumeBtn.style.display = "none";
  }else if(voiceCall.state === "thinking"){
    orb.textContent = "⏳";
    stTxt.textContent = "المعلم يفكر في الرد...";
    if(skipBtn) skipBtn.style.display = "none";
    if(resumeBtn) resumeBtn.style.display = "none";
  }else{
    orb.textContent = "⏸️";
    stTxt.textContent = "في انتظار صوتك — اضغط للتحدث";
    if(skipBtn) skipBtn.style.display = "none";
    if(resumeBtn) resumeBtn.style.display = "inline-block";
  }
  intTxt.textContent = voiceCall.interim ? `"${voiceCall.interim}..."` : "";
  noteTxt.textContent = voiceCall.note || "";
}

function endVoiceCall(silent=false){
  voiceCall.active = false;
  voiceCall.session++;
  voiceCall.state = "idle";
  voiceCall.interim = "";
  voiceCall.note = "";
  stopSpeak();
  stopMic();
  if(!silent) R.ai();
}

function startCallListening(sid){
  if(!voiceCall.active || voiceCall.session !== sid) return;
  if(!SpeechRec){
    voiceCall.note = "⚠️ متصفحك لا يدعم الميكروفون الصوتي (استخدم Google Chrome).";
    voiceCall.state = "paused";
    updateCallUI();
    return;
  }
  voiceCall.state = "listening";
  voiceCall.interim = "";
  voiceCall.note = "";
  updateCallUI();

  listenGerman({
    interimResults: true,
    onInterim: txt => {
      if(!voiceCall.active || voiceCall.session !== sid) return;
      voiceCall.interim = txt;
      updateCallUI();
    },
    onResult: best => {
      if(!voiceCall.active || voiceCall.session !== sid) return;
      voiceCall.interim = "";
      voiceCall.state = "thinking";
      updateCallUI();
      processTutorTurn(best, true, sid);
    },
    onError: err => {
      if(!voiceCall.active || voiceCall.session !== sid) return;
      if(err === "no-speech"){
        voiceCall.note = "لم أسمع صوتاً. اضغط (🎙️ تحدث الآن) عندما تكون جاهزاً.";
      }else if(err === "not-allowed"){
        voiceCall.note = "⚠️ تم رفض إذن الميكروفون. فعّل الميكروفون من إعدادات المتصفح.";
      }else if(err !== "aborted"){
        voiceCall.note = "تنبيه صوتي: " + err;
      }
      voiceCall.state = "paused";
      updateCallUI();
    },
    onEnd: gotFinal => {
      if(!voiceCall.active || voiceCall.session !== sid) return;
      if(!gotFinal && voiceCall.state === "listening"){
        voiceCall.state = "paused";
        if(!voiceCall.note) voiceCall.note = "توقف الاستماع. اضغط (🎙️ تحدث الآن) للمتابعة.";
        updateCallUI();
      }
    }
  });
}

function speakAndListenInCall(germanText, sid){
  if(!voiceCall.active || voiceCall.session !== sid) return;
  voiceCall.state = "speaking";
  voiceCall.interim = "";
  voiceCall.note = "";
  updateCallUI();
  speak(germanText, voiceCall.rate, () => {
    if(!voiceCall.active || voiceCall.session !== sid) return;
    setTimeout(() => startCallListening(sid), 250);
  });
}

function startVoiceCall(scenIdx = null){

function parseTutorResponse(raw){
  try{
    const obj = extractJsonObj(raw);
    if(obj && obj.de){
      return {
        de: String(obj.de).trim(),
        ar: String(obj.ar || "").trim(),
        fix: String(obj.fix || "").trim()
      };
    }
  }catch(e){}
  const cleaned = String(raw || "").replace(/```json/gi,"").replace(/```/g,"").trim();
  const lines = cleaned.split("\n").map(x=>x.trim()).filter(Boolean);
  return {
    de: lines[0] || "Sehr gut!",
    ar: lines.slice(1).join(" "),
    fix: ""
  };
}

function localFallbackReply(txt){
  const low = txt.toLowerCase();
  if(low.includes("hallo")||low.includes("guten"))
    return {de:"Hallo! Mir geht es gut, danke. Wie heißt du?", ar:"مرحباً! أنا بخير، شكراً. ما اسمك؟", fix:""};
  if(low.includes("heiße")||low.includes("name")||low.includes("bin"))
    return {de:"Freut mich! Woher kommst du und wo wohnst du?", ar:"تشرفت بك! من أين أنت وأين تسكن؟", fix:""};
  if(low.includes("ägypten")||low.includes("kairo")||low.includes("wohne")||low.includes("komme"))
    return {de:"Oh, Ägypten ist sehr schön! Lernst du gern Deutsch?", ar:"أوه، مصر جميلة جداً! هل تحب تعلم الألمانية؟", fix:""};
  if(low.includes("kaffee")||low.includes("tee")||low.includes("wasser")||low.includes("möchte"))
    return {de:"Sehr gern! Möchtest du auch etwas essen? Vielleicht Brot?", ar:"بكل سرور! هل تود أن تأكل شيئاً أيضاً؟ ربما خبزاً؟", fix:""};
  if(low.includes("danke"))
    return {de:"Bitte schön! Was möchtest du jetzt machen?", ar:"عفواً! ماذا تود أن تفعل الآن؟", fix:""};
  if(low.includes("bahnhof")||low.includes("wo ist"))
    return {de:"Gehen Sie geradeaus und dann links. Der Bahnhof ist dort.", ar:"اذهب للأمام مباشرة ثم يساراً. المحطة هناك.", fix:""};
  if(low.includes("kopf")||low.includes("krank")||low.includes("arzt"))
    return {de:"Gute Besserung! Trink bitte viel Wasser und schlaf gut.", ar:"ألف سلامة! اشرب الكثير من الماء ونم جيداً.", fix:""};
  return {
    de:"Sehr gut! Kannst du mir noch mehr darüber erzählen?",
    ar:"ممتاز! هل يمكنك أن تخبرني المزيد عن ذلك؟",
    fix:"💡 أضف مفتاح Gemini API بالأسفل للمحادثة السحابية على الموبايل أو شغّل Ollama على الكمبيوتر."
  };
}

async function processTutorTurn(txt, fromVoiceCall=false, sid=null){
  txt=String(txt||"").trim();
  if(!txt){
    if(fromVoiceCall&&voiceCall.active&&voiceCall.session===sid){voiceCall.note="لم أستطع فهم كلامك. اتكلم بالألماني بوضوح وقرّب من الميكروفون، أو اكتب رسالتك.";voiceCall.state="paused";updateCallUI();}
    else alert("لم أستطع فهم كلامك. اتكلم بالألماني بوضوح أو اكتب الرسالة.");
    return;
  }
  const key = getCleanKey();
  chatLog.push({r:"me", de:txt});
  R.ai();
  touch(true, 6);

  let parsed = null;
  if(key){
    try{
      const recentHistory = chatLog.slice(-6).map(m => (m.r==="me"?"Student: ":"Teacher: ") + m.de).join("\n");
      const learnedSample = words.filter(w=>w.box>=1).slice(0,20).map(w=>w.w).join(", ") || "hallo, danke, Kaffee, wohnen";
      const prompt = `You are a warm, encouraging German A1 conversation partner and tutor for an Arabic-speaking student (live voice conversation mode).
Recent conversation:
${recentHistory}

Student just said: "${txt}" (Note: input may come from speech-to-text, so ignore minor punctuation/capitalization issues).
Respond ONLY with valid JSON (no markdown fences) in this exact format:
{
  "de": "Your natural, conversational reply in simple A1 German (1 to 2 short sentences, ending with a simple question to keep the dialogue flowing).",
  "ar": "Natural Arabic translation of your German reply.",
  "fix": "If the student made a clear grammar or vocabulary mistake, give a brief, friendly tip in Arabic. Otherwise leave empty string \"\"."
}
Student knows A1 words like: ${learnedSample}.`;
      const raw = await callGemini(prompt);
      parsed = parseTutorResponse(raw);
    }catch(e){
      if(fromVoiceCall && voiceCall.active && voiceCall.session === sid){
        voiceCall.note = "⚠️ تعذر الاتصال بـ AI: " + e.message;
        voiceCall.state = "paused";
        updateCallUI();
      }
      chatLog.push({r:"ai", de:"Entschuldigung, es gibt ein Verbindungsproblem.", ar:"", fix:"⚠️ " + e.message});
      R.ai();
      return;
    }
  }else{
    parsed = localFallbackReply(txt);
  }

  chatLog.push({r:"ai", de:parsed.de, ar:parsed.ar, fix:parsed.fix});
  R.ai();

  if(fromVoiceCall){
    speakAndListenInCall(parsed.de, sid);
  }else{
    speak(parsed.de, voiceCall.rate);
  }
}

R.ai=function(){

  </div>

    <summary style="cursor:pointer;font-weight:bold">📥 لصق كلمات جماعي / نسخ احتياطي</summary>

    words=d.filter(x=>x&&x.w&&x.ar).map(x=>({art:x.art||"",w:x.w,ar:x.ar,en:x.en||"",ex:x.ex||"",pl:x.pl||"",box:x.box||0,due:x.due||0,u:x.u||"كلماتي"}));

// ===== 13. LEARNING PATH =====
const PER=5;
let L=null;
function levels(){
  const out=[];
  words.forEach(w=>{const u=w.u||"كلماتي";let c=out[out.length-1];if(!c||c.u!==u||c.ws.length>=PER)out.push(c={u,ws:[]});c.ws.push(w)});
  return out;
}
R.path=function(){
  const lv=levels(),n=lv.length,p=$("#p-path");
  let h=`<div class="stats" style="grid-template-columns:1fr 1fr"><div><b>${pr.xp}</b>نقاط XP</div><div><b>${Object.keys(pr.done).length}/${n}</b>مستويات مكتملة</div></div>`;
  for(let i=0;i<n;i++){
    if(i===0||lv[i].u!==lv[i-1].u)h+=`<h3 style="text-align:center;margin:22px 0 4px">${esc(lv[i].u)}</h3>`;
    const s=pr.done[i],open=i===0||pr.done[i-1]!==undefined;
    h+=`<div style="text-align:center;transform:translateX(${[0,38,0,-38][i%4]}px)"><button class="node ${s?"done":open?"open":""}" data-l="${i}" ${open?"":"disabled"}>${s?"★".repeat(s):open?"▶":"🔒"}</button></div>`;
  }
  p.innerHTML=h;
  p.onclick=e=>{const b=e.target.closest("[data-l]");if(b)startLesson(+b.dataset.l)};
};

function startLesson(i){
  const ws=levels()[i].ws,qs=[];
  ws.forEach(w=>{qs.push({w,k:"de"});qs.push({w,k:w.art?"art":"ar"})});
  L={i,ws,qs:qs.sort(()=>Math.random()-.5),n:0,lives:3,miss:0,intro:true};
  drawL();
}

function drawL(){
  const p=$("#p-path"),out=()=>{$("#ex2").onclick=R.path};
  if(L.intro){
    p.innerHTML=`<div class="card"><h3>كلمات المستوى ${L.i+1}</h3>
    ${L.ws.map(w=>`<div class="li"><span class="${cls(w)}"><b>${esc(label(w))}</b> ${w.pl&&w.pl!=="—"?`<small>(${esc(w.pl)})</small>`:""} <button data-speak="${esc(label(w))}">🔊</button></span><span style="direction:rtl">${esc(w.ar)}</span></div>`).join("")}
    <div class="row"><button class="pri" id="go">ابدأ الدرس</button><button id="ex2">خروج</button></div></div>`;
    p.onclick=null;
    $("#go").onclick=()=>{L.intro=false;drawL()};out();return;
  }
  if(L.lives<=0){
    p.innerHTML=`<div class="card"><h3>خلصت المحاولات 💔</h3><div class="row"><button class="pri" id="rt">حاول تاني</button><button id="ex2">خروج</button></div></div>`;
    $("#rt").onclick=()=>startLesson(L.i);out();return;
  }
  if(L.n>=L.qs.length){
    const stars=L.miss===0?3:L.miss===1?2:1,gain=10*(L.qs.length-L.miss);
    pr.xp+=gain;pr.done[L.i]=Math.max(pr.done[L.i]||0,stars);save("de_path",pr);
    L.ws.forEach(w=>promoteWord(w,1));
    saveWords();
    touch(true,gain);
    p.innerHTML=`<div class="card"><h2>أحسنت! ${"★".repeat(stars)}</h2><p>+${gain} XP وتمت إضافة الكلمات للمراجعة الدورية</p><div class="row"><button class="pri" id="ex2">متابعة المسار</button></div></div>`;
    out();return;
  }
  const q=L.qs[L.n],w=q.w;let text,ans,opts;
  if(q.k==="art"){text=`ما أداة <b dir=ltr>${esc(w.w)}</b>؟`;ans=w.art;opts=["der","die","das"]}
  else if(q.k==="de"){text=`ما معنى <b dir=ltr class="${cls(w)}">${esc(label(w))}</b>؟`;ans=w.ar;opts=pick(words.filter(x=>x.ar!==w.ar),3).map(x=>x.ar).concat(w.ar)}
  else{text=`كيف تقول "${esc(w.ar)}" بالألماني؟`;ans=w.w;opts=pick(words.filter(x=>x.w!==w.w),3).map(x=>x.w).concat(w.w)}
  if(q.k!=="art")opts.sort(()=>Math.random()-.5);
  p.innerHTML=`<div class="top"><button id="ex2">✕</button><div class="bar"><i style="width:${L.n/L.qs.length*100}%"></i></div><span>${"❤️".repeat(L.lives)}</span></div>
  <div class="card"><p>${text} <button id="qs">🔊</button></p><div class="row opts">${opts.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div><div class="msg" id="qm"></div></div>`;
  out();$("#qs").onclick=()=>speak(label(w));
  p.onclick=e=>{
    const o=e.target.dataset.o;if(o===undefined||q.done)return;q.done=1;
    const ok=o===ans;touch(ok,ok?5:0);if(!ok){L.lives--;L.miss++;missAdd(w)}
    e.target.classList.add(ok?"ok":"bad");
    p.querySelectorAll(".opts button").forEach(b=>{if(b.dataset.o===ans)b.classList.add("ok")});
    $("#qm").innerHTML=(ok?"صح ✓":`غلط. الصح: <b dir=ltr>${esc(ans)}</b>`)+`<br><span class="ex">${esc(w.ex)}</span><div class="row"><button class="pri" id="nx">متابعة</button></div>`;
    $("#nx").onclick=()=>{L.n++;drawL()};if(ok)speak(label(w));
  };
}

function buildExamFromTasks(tasksObj){
  const g = pick(GR.flatMap(x=>x.qs.map(q=>({sec:"📖 القواعد والمفردات", q:q.q, o:q.o, a:q.a, e:q.e, w:null}))), 6);
  const vq = pick(words, 6).map(w=>{
    const o = pick(words.filter(x=>x.ar!==w.ar),3).map(x=>x.ar).concat(w.ar).sort(()=>Math.random()-.5);
    return {sec:"📖 القواعد والمفردات", q:"ما معنى "+label(w)+"؟", o, a:o.indexOf(w.ar), e:label(w)+" = "+w.ar, w};
  });
  const li = (tasksObj.listen||[]).map(x=>({sec:"🎧 الاستماع (Hören)", type:"listen", audio:x.audio, q:x.q, o:x.o, a:x.a, e:x.e||""}));
  const rd = (tasksObj.read||[]).map(x=>({sec:"📄 القراءة (Lesen)", type:"read", text:x.text, q:x.q, o:x.o, a:x.a, e:x.e||""}));
  const wr = (tasksObj.write||[]).map(x=>({sec:"✍️ الكتابة (Schreiben)", type:"write", prompt:x.prompt, sample:x.sample||""}));
  const sp = (tasksObj.speak||[]).map(x=>({sec:"🎙️ التحدث (Sprechen)", type:"speak", prompt:x.prompt, hint:x.hint||""}));
  const mcqCount = li.length + rd.length + g.length + vq.length;
  return {q:[...li, ...rd, ...g, ...vq, ...wr, ...sp], i:0, ok:0, maxPts: mcqCount + (wr.length*4) + (sp.length*4)};
}

function mkExam(){
  return buildExamFromTasks({
    listen: pick(EXAM_TASKS.listen, 3),
    read: pick(EXAM_TASKS.read, 3),
    write: pick(EXAM_TASKS.write, 1),
    speak: pick(EXAM_TASKS.speak, 1)
  });
}

        EX.ok += pts;
        touch(pts>=2, pts*3);
        $("#xm").innerHTML = `<div style="background:var(--bg);padding:10px;border-radius:8px">${esc(res)}</div><div class="row"><button class="pri" id="xn">التالي</button></div>`;
      }catch(e){
        const pts = val.split(/\s+/).length >= 12 ? 3 : 2;
        EX.ok += pts;
        touch(true, pts*3);
        $("#xm").innerHTML = `<b>التقييم التلقائي: ${pts}/4</b><br>نموذج مقترح: <div dir="ltr" style="color:var(--pri);margin-top:4px">${esc(q.sample)}</div><div class="row"><button class="pri" id="xn">التالي</button></div>`;
      }
      $("#xn").onclick=()=>{EX.i++;R.exam()};
    };
    return;
  }

  if(q.type === "speak"){
    let spDone = false;
    const finishSpeak = async (spokenText) => {
      if(spDone) return;
      spDone = true;
      $("#ex-sp-mic").disabled = true;
      $("#ex-sp-skip").disabled = true;
      $("#ex-sp-txtsub").disabled = true;
      $("#xm").innerHTML = "⏳ جاري تقييم التحدث...";
      if(spokenText){
        try{
          const res = await callGemini(`Grade this German A1 speaking response out of 4 points. Prompt: "${q.prompt}". Student said: "${spokenText}". Reply briefly in Arabic with score (X/4) and feedback.`);
          const m = res.match(/([0-4])\s*\/\s*4/);
          const pts = m ? +m[1] : 3;
          EX.ok += pts;
          touch(pts>=2, pts*3);
          $("#xm").innerHTML = `<div style="background:var(--bg);padding:10px;border-radius:8px">${esc(res)}</div><div class="row"><button class="pri" id="xn">إنهاء وعرض النتيجة</button></div>`;
          $("#xn").onclick=()=>{EX.i++;R.exam()};
          return;
        }catch(e){}
      }
      const pts = spokenText ? 3 : 1;
      EX.ok += pts;
      touch(!!spokenText, pts*2);
      $("#xm").innerHTML = `<b>التقييم: ${pts}/4</b><br>عبارة نموذجية: <div dir="ltr" style="color:var(--pri);margin:4px 0">${esc(q.hint)} <button data-speak="${esc(q.hint)}">🔊</button></div><div class="row"><button class="pri" id="xn">إنهاء وعرض النتيجة</button></div>`;
      $("#xn").onclick=()=>{EX.i++;R.exam()};
    };

    $("#ex-sp-mic").onclick=()=>{
      listenGerman({
        btn:$("#ex-sp-mic"),
        onResult:best=>{
          $("#ex-sp-heard").textContent = `"${best}"`;
          finishSpeak(best);
        },
        onError:err=>alert("خطأ في الميكروفون: "+err)
      });
    };
    $("#ex-sp-txtsub").onclick=()=>{
      const t = $("#ex-sp-txt").value.trim();
      if(!t){alert("اكتب العبارة أو استخدم الميكروفون");return;}
      $("#ex-sp-heard").textContent = `"${t}"`;
      finishSpeak(t);
    };
    $("#ex-sp-skip").onclick=()=>finishSpeak("");
    return;
  }

  let done=false;
  p.querySelector(".opts").onclick=e=>{
    const i=e.target.dataset.i;if(i===undefined||done)return;done=true;
    const ok=+i===q.a;touch(ok,ok?5:0);if(ok)EX.ok++;else if(q.w)missAdd(q.w);
    e.target.classList.add(ok?"ok":"bad");
    p.querySelectorAll(".opts button")[q.a].classList.add("ok");
    $("#xm").innerHTML=(ok?"صح ✓ ":"غلط ✗ ")+esc(q.e)+`<div class="row"><button class="pri" id="xn">التالي</button></div>`;
    $("#xn").onclick=()=>{EX.i++;R.exam()};
  };
};

show("path");
if(syncCfg().type!=="none")syncNow(true);
} catch (err) {
  document.body.insertAdjacentHTML("beforeend", `<div class="card" style="color:var(--bad);direction:ltr;text-align:left"><b>Startup Error:</b> ${String(err && err.message || err)}</div>`);
}
</script>
</body>
</html>
